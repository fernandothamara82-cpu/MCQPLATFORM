<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysChem MCQ Transformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); }
        
        /* Advanced Scientific & Math Notation */
        .scientific-content { line-height: 1.8; }
        
        sub { font-size: 0.75em; vertical-align: sub; line-height: 0; }
        sup { font-size: 0.75em; vertical-align: super; line-height: 0; }
        
        .fraction { 
            display: inline-flex; 
            flex-direction: column; 
            vertical-align: middle; 
            align-items: center; 
            font-size: 0.85em; 
            line-height: 1; 
            margin: 0 0.15em;
            padding-bottom: 0.1em;
        }
        .fraction .bar { 
            border-top: 1.5px solid currentColor; 
            width: 100%; 
            margin: 0.1em 0; 
        }

        .sqrt {
            display: inline-flex;
            align-items: flex-start;
            vertical-align: middle;
            margin: 0 0.1em;
        }
        .sqrt .radical {
            font-size: 1.2em;
            margin-right: -0.1em;
            line-height: 1;
        }
        .sqrt .vinculum {
            border-top: 1.5px solid currentColor;
            padding: 0.1em 0.2em 0 0.1em;
            margin-top: 0.2em;
            line-height: 1.2;
        }

        /* Sinhala Text Tweaks */
        [lang="si"] {
            line-height: 2;
            letter-spacing: 0.02em;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
